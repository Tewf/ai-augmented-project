# Merged onto reader-ergonomics' own config, table by table; a value here wins (extending.md, the interface).
extends = "reader-ergonomics"

# The standard's three, and the answers file: it changes with every file it answers for, so it co-changes by construction.
[co_change]
exempt = ["standard.md", "llms.txt", "checks/judgments.toml"]

# The site loads the standard's own stylesheet (_standard/site.css, checked out in pages.yml), so there is none here
# to measure; reader-ergonomics extending.md asks such a repository to list none.
[readable_measure]
stylesheets = []

[sufficient_contrast]
stylesheets = []

# The principle groups, in the order the card shows them (reader-ergonomics extending.md, the interface).
[standard_card]
facets = ["session", "memory"]

# The local checks, checks/local/. Their tests run in CI: python3 -m unittest discover -s checks.
# Where a session starts: START.md at a project's root, and this repository's example of one.
[start_file]
files = ["START.md", "shapes/examples/start-file.md", "experiments/method-comparison/fixtures/common/START.md"]
max_lines = 200                 # PROVISIONAL: no study sets a length; one vendor's target is under 200
precedence = "follow the code"  # the phrase the precedence sentence must hold, said once
exempt = ["checks/out/", "brief.md", "memory/INDEX.md", ".handover/note.md"]  # made at run time, which a fresh checkout does not have

# One brief per task: brief.md in the task's folder, and this repository's example of one.
[brief]
files = ["brief.md", "*/brief.md", "experiments/method-comparison/fixtures/*/brief.md"]
exempt = ["shapes/brief.md"]   # the shape of a brief is not a brief
pass_words = 2                  # PROVISIONAL: the fewest words beside a command that can say what passing means

# The memory index and the files it lists.
[memory]
indexes = ["memory/INDEX.md", "shapes/examples/memory/INDEX.md", "experiments/method-comparison/fixtures/common/memory/INDEX.md"]
max_lines = 200                 # PROVISIONAL: no study sets a length; one vendor caps its index
types = ["fact", "rule", "reference"]

# The shapes, shapes/*.md; their filled examples sit in shapes/examples/ and are not shapes themselves.
[shape_example]
files = ["shapes/*.md"]
exempt = ["shapes/README.md", "shapes/examples/*"]
example_headings = ["Worked example", "Example"]

# The headings the standard's decision-record shape requires (reader-ergonomics v1.21.0, shapes/decision-record.md).
[shape_conformance]
shapes = [{ name = "decision record", files = ["decisions/0*.md"], required = ["Context", "Decision", "Consequences", "See also"] }]

# Path questions are answered with their path quoted, so the quotes check stays strict.
[judgment_quotes]
optional = []

[bibliography_keys]
# A key names one work across the family (reader-ergonomics decision 0003); CI clones each name beside this repository.
family = ["reader-ergonomics",
          "reader-ergonomics-topic",
          "reader-ergonomics-blueprint",
          "reader-ergonomics-review"]
shared_links = []

# The inputs of the method comparison are frozen as the sessions received them: three briefs of one shape share
# their boilerplate on purpose, and the fixture folders mirror the project the agent is handed.
[duplication]
exempt = ["experiments/method-comparison/fixtures/*/brief.md"]

[tree_shape]
exempt = ["experiments/method-comparison/fixtures/*"]
