project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!checks/"
  resources:
    - LICENSE
    - LICENSES/
    - "**/*.md"

website:
  title: "AI-augmented project"
  site-url: "https://tewf.github.io/ai-augmented-project/"
  repo-url: "https://github.com/Tewf/ai-augmented-project"
  description: "How a person, a language model and a machine are set up and run one project together: what each decides, what a session is handed, how memory is kept and audited, each rule with its grade of evidence and a check to run in CI."
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    left:
      - text: Decisions
        href: decisions/README.md
    right:
      - text: The family
        href: https://tewf.github.io/ai-augmented/
      - text: The standard
        href: https://tewf.github.io/reader-ergonomics/
  sidebar:
    style: docked
    search: true
    contents: auto

# The stylesheet is reader-ergonomics' own, checked out into _standard/ at build time
# (pages.yml), so the house style lives in one place; Quarto skips folders named with "_".
format:
  html:
    from: markdown-smart
    shift-heading-level-by: -1
    html-math-method: mathml
    toc: true
    toc-depth: 2
    theme:
      light: cosmo
      dark: darkly
    css: _standard/site.css
    link-external-newwindow: false
